for(let k=0;k<6;k++)if(R()<.5){b.fillStyle='rgba(255,190,80,.8)';b.fillRect(x+5+R()*(w-12),G-h+8+R()*(h-14),4,5)}x+=w+2}

for(let d=20;d<W;d+=60){const gl=b.createRadialGradient(d,G+8,0,d,G+8,22);gl.addColorStop(0,'rgba(255,170,40,.9)');gl.addColorStop(1,'rgba(255,120,0,0)');b.fillStyle=gl;b.fillRect(d-22,G-14,44,44);b.fillStyle='#ffd27a';b.fillRect(d-2,G+4,4,5)}}

/* ---------- AUDIO ---------- */
let AC,NB,M,voices=0;
function ainit(){if(AC){if(AC.state=='suspended')AC.resume();return}
AC=new(window.AudioContext||window.webkitAudioContext)();const cp=AC.createDynamicsCompressor();M=AC.createGain();M.gain.value=.9;M.connect(cp);cp.connect(AC.destination);const rv=AC.createConvolver(),ib=AC.createBuffer(2,AC.sampleRate*2.2|0,AC.sampleRate);for(let c=0;c<2;c++){const d=ib.getChannelData(c);for(let i=0;i<d.length;i++)d[i]=(R()*2-1)*Math.pow(1-i/d.length,3)}rv.buffer=ib;const wg=AC.createGain();wg.gain.value=.3;M.connect(wg);wg.connect(rv);rv.connect(cp);
NB=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=R()*2-1}
function nz(){const s=AC.createBufferSource();s.buffer=NB;s.loop=true;return s}
function boom(v,delay=0){if(v>.7&&navigator.vibrate)navigator.vibrate(Math.min(90,v*60|0));if(!AC||voices>28)return;voices++;const t=AC.currentTime+delay,s=nz(),f=AC.createBiquadFilter(),g=AC.createGain();
f.type='lowpass';f.frequency.setValueAtTime(1500*v+500,t);f.frequency.exponentialRampToValueAtTime(70,t+.8*v+.3);
g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.004);g.gain.exponentialRampToValueAtTime(.001,t+1.1*v+.4);
s.connect(f);f.connect(g);g.connect(M);s.start(t,R());s.stop(t+1.6*v+.5);s.onended=()=>voices--;
const o=AC.createOscillator(),og=AC.createGain();o.frequency.setValueAtTime(110,t);o.frequency.exponentialRampToValueAtTime(26,t+.5);
og.gain.setValueAtTime(v*.9,t);og.gain.exponentialRampToValueAtTime(.001,t+.6);o.connect(og);og.connect(M);o.start(t);o.stop(t+.7)}
function crack(v,hp=1000){if(!AC||voices>36)return;voices++;const t=AC.currentTime,s=nz(),f=AC.createBiquadFilter(),g=AC.createGain();
f.type='highpass';f.frequency.value=hp+R()*1200;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+.05+R()*.05);
s.connect(f);f.connect(g);g.connect(M);s.start(t,R());s.stop(t+.12);s.onended=()=>voices--}
function hiss(dur,v,fr=4000){if(!AC)return;const t=AC.currentTime,s=nz(),f=AC.createBiquadFilter(),g=AC.createGain();
f.type='bandpass';f.frequency.value=fr;f.Q.value=.6;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.1);g.gain.setValueAtTime(v,t+dur-.3>.1?t+dur-.3:t+.1);g.gain.linearRampToValueAtTime(0,t+dur);
s.connect(f);f.connect(g);g.connect(M);s.start(t,R());s.stop(t+dur)}
function whistle(dur){if(!AC)return;const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.frequency.setValueAtTime(600,t);o.frequency.exponentialRampToValueAtTime(2600,t+dur);
g.gain.setValueAtTime(.05,t);g.gain.linearRampToValueAtTime(0,t+dur);o.connect(g);g.connect(M);o.start(t);o.stop(t+dur);hiss(dur,.12,2500)}
function thump(v){if(!AC)return;const t=AC.currentTime,s=nz(),f=AC.createBiquadFilter(),g=AC.createGain();f.type='lowpass';f.frequency.value=350;
g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+.2);s.connect(f);f.connect(g);g.connect(M);s.start(t,R());s.stop(t+.25)}
/* ---------- PARTICLES ---------- */
let P=[],S=[],F=[],I=[],L=[],flash=0,shake=0;
function sp(x,y,vx,vy,life,h,s,l,sz,g,dr,pop){if(P.length<5000)P.push({x,y,vx,vy,life,max:life,h,s,l,sz,g,dr,pop})}
function glow(x,y,r,life,c='255,220,150'){if(F.length<150)F.push({x,y,r,life,max:life,c})}
function later(ms,fn){L.push({t:ms/1000,fn})}
function burst(x,y,type,sc,h,n){if(n>40){glow(x,y,150*sc+60,.7,rgb(h));if(y<G-80)smoke(x,y,sc*.6)}for(let i=0;i<n;i++){let a=R()*PI2,s=(.35+R()*.65)*300*sc,life=1.4+R()*.8,hh=h+R()*24-12,g=140,dr=.975,l=60,pop=0;

if(type=='multi')hh=h+(i%3)*110;
sp(x,y,Math.cos(a)*s,Math.sin(a)*s,life,hh,95,l,1.8*Math.min(sc,1.4)+.6,g,dr,pop)}}
function explode(s){const{x,y}=s;
if(s.k=='heart'||s.k=='star'){flash=.4;const h=s.k=='heart'?345:50;shape(x,y,s.k,h);glow(x,y,260,.6,rgb(h));smoke(x,y,.8);boom(.8,.1);shake=8;later(300,()=>{burst(x,y,'crackle',1,50,60);boom(.4)})}else if(s.k=='big'){flash=1;shake=18;const h=R()*360;burst(x,y,'peony',1.9,h,300);burst(x,y,'ring',1.5,h+140,110);burst(x,y,'willow',1.6,42,150);glow(x,y,380,.7);boom(1.25,.12);
later(350,()=>{burst(x,y,'crackle',1.4,50,130);boom(.8);shake=8});
later(750,()=>{for(let i=0;i<3;i++){const ax=x+(R()-.5)*260,ay=y+(R()-.3)*160;burst(ax,ay,'multi',1,R()*360,90);glow(ax,ay,160,.4)}boom(.9);shake=10})}
else if(s.k=='rocket'){const h=R()*360;burst(x,y,R()<.5?'peony':'multi',1.1,h,130);burst(x,y,'crackle',.8,50,50);glow(x,y,200,.5);boom(.7,.08);shake=4}
else{const h=R()*360,t=['peony','ring','willow','multi'][R()*4|0];burst(x,y,t,.75,h,70);glow(x,y,120,.35);boom(.38,.06)}}
function shell(x,y,k,hFrac,vx){const h=G*hFrac,vy=-Math.sqrt(2*300*h);S.push({x,y,vx:vx||0,vy,k});
if(k=='rocket'){whistle(-vy/300)}else{thump(k=='big'?.8:.35);if(k=='big')hiss(.8,.1,1800)}
for(let i=0;i<8;i++)sp(x,y,(R()-.5)*120,-R()*40,.4,35,90,70,1.4,200,.9)}
/* ---------- ITEMS ---------- */
const LH=()=>Math.min(H*.45,320);
function add(k,x){if(I.length>22)return;const it={k,x,t:0,n:0,acc:0,fuse:FZ[k]||1.3,fired:0,dead:0};I.push(it);hiss(it.fuse,.05,5000)}
function upd(it,dt){it.t+=dt;
if(it.t<it.fuse){for(let i=0;i<3;i++)sp(it.tx,it.ty,(R()-.5)*90,-R()*80,.3,40,100,70,1.2,150,.9);return}
const k=it.k;
if(k=='sky'&&!it.fired){it.fired=1;shell(it.x,G-80,'big',.62,(R()-.5)*20);it.dead=1}
else if(k=='rocket'&&!it.fired){it.fired=1;shell(it.x,G-70,'rocket',.5+R()*.2,(R()-.5)*70);for(let i=0;i<30;i++)sp(it.x,G-10,(R()-.5)*260,-R()*40,.5,30,90,70,1.5,300,.9);glow(it.x,G-10,90,.3);it.dead=1}
else if(k=='cake'){it.acc-=dt;if(it.acc<=0&&it.n<30){it.n++;it.acc=.14+R()*.3;
if(it.n>=29){for(let j=0;j<4;j++)shell(it.x,G-50,'s',.4+R()*.3,(j-1.5)*70)}else shell(it.x,G-50,'s',.35+R()*.3,(R()-.5)*160)}
if(it.n>=30&&it.acc<-.5)it.dead=1}
else if(k=='lad'){const h=LH();it.acc+=dt*75;while(it.acc>=1&&it.n<1000){it.acc--;it.n++;const y=G-30-h*it.n/1000,x=it.x+(R()-.5)*10;
glow(x,y,26+R()*22,.12,'255,230,160');for(let i=0;i<4;i++){const a=R()*PI2,s=100+R()*180;sp(x,y,Math.cos(a)*s,Math.sin(a)*s-40,.3+R()*.4,20+R()*30,100,60,1.3,420,.92)}
if(it.n%2==0)crack(.25+R()*.35);if(it.n%60==0){boom(.5);shake=5}}
if(it.n>=1000){it.end=(it.end||0)+dt;if(it.end>.6)it.dead=1}}
else if(k=='sutli'&&!it.fired){it.fired=1;boom(.6);crack(.6);shake=4;flash=Math.max(flash,.15);glow(it.x,G-14,110,.25,'255,200,120');for(let i=0;i<26;i++){const a=R()*PI2,s=80+R()*240;sp(it.x,G-14,Math.cos(a)*s,Math.sin(a)*s-60,.4+R()*.4,30+R()*25,100,65,1.5,500,.93)}it.dead=1}
else if(k=='atom'&&!it.fired){it.fired=1;flash=1;shake=28;glow(it.x,G-25,460,.9,'255,170,70');burst(it.x,G-25,'ring',1.7,28,140);shockRing(it.x,G-6,1.6);shockRing(it.x,G-6,1);smoke(it.x,G-40,3);for(let i=0;i<5;i++)later(i*250,()=>smoke(it.x+(R()-.5)*40,G-60-i*45,2.2));for(let i=0;i<120;i++){const a=-R()*Math.PI,s=80+R()*420;sp(it.x,G-20,Math.cos(a)*s,Math.sin(a)*s,1+R()*1.4,15+R()*30,100,60,2.6+R()*2,450,.97)}burst(it.x,G-30,'peony',1.3,25,180);burst(it.x,G-30,'willow',1.2,38,90);boom(1.3);crack(1);later(220,()=>{boom(1);shake=14;burst(it.x,G-60,'crackle',1.2,50,80)});it.dead=1}
else if(k=='barrage'){it.acc-=dt;if(it.acc<=0&&it.n<6){it.n++;it.acc=.2+R()*.2;shell(it.x,G-60,'rocket',.4+R()*.35,(R()-.5)*170)}if(it.n>=6&&it.acc<-.3)it.dead=1}
else if(k=='chakri'){if(!it.fired){it.fired=1;hiss(6,.14,2600)}if(it.t-it.fuse>6){it.dead=1;return}it.x+=Math.sin(it.t*2.3)*55*dt;const y=G-8,a=it.ang||0;for(let j=0;j<3;j++){const aa=a+j*2.09+R()*.2;sp(it.x+Math.cos(aa)*14,y+Math.sin(aa)*14,Math.cos(aa+1.3)*160+(R()-.5)*50,Math.sin(aa+1.3)*160-R()*50,.5+R()*.3,R()<.2?120:35+R()*15,100,65,1.4,260,.93)}glow(it.x,y,60,.05,'255,190,90')}
else if(k=='phuljhadi'){if(!it.fired){it.fired=1;hiss(8,.1,6000)}if(it.t-it.fuse>8){it.dead=1;return}for(let j=0;j<7;j++){const a=R()*PI2,s=60+R()*200;sp(it.x,G-112,Math.cos(a)*s,Math.sin(a)*s,.25+R()*.3,45+R()*10,60,85,1.2,120,.9)}glow(it.x,G-112,70,.05,'255,240,200');if(R()<.2)crack(.08,4000)}
else if((k=='heart'||k=='star')&&!it.fired){it.fired=1;shell(it.x,G-50,k,.6,(R()-.5)*20);it.dead=1}
else if(k=='mega'){it.acc-=dt;if(it.acc<=0&&it.n<100){it.n++;it.acc=.07+R()*.12;shell(it.x,G-50,'s',.3+R()*.4,(R()-.5)*260)}if(it.n>=100&&it.acc<-.8)it.dead=1}
else if(k=='bijli'&&!it.fired){it.fired=1;for(let i=0;i<4;i++)later(i*110,()=>{boom(.7);crack(.8);shake=5;flash=Math.max(flash,.18);glow(it.x,G-14,120,.2,'255,90,80');for(let j=0;j<18;j++){const a=R()*PI2,s=100+R()*220;sp(it.x,G-14,Math.cos(a)*s,Math.sin(a)*s-50,.4,5+R()*15,100,60,1.4,500,.93)}shockRing(it.x,G-6,.8)});it.dead=1}
else if(k=='chatai'){if(!it.fired){it.fired=1;it.acc=0}if(it.t-it.fuse>4){it.dead=1;return}it.acc+=dt*45;while(it.acc>=1){it.acc--;const x=it.x+(R()-.5)*70,y=G-4-R()*10;crack(.3+R()*.3,1500);glow(x,y,30,.1,'255,220,150');for(let j=0;j<4;j++){const a=-R()*Math.PI,s=80+R()*160;sp(x,y,Math.cos(a)*s,Math.sin(a)*s,.3+R()*.3,30+R()*20,100,65,1.2,500,.92)}if(R()<.03)smoke(x,y,.3)}}
else if(k=='heli'){if(!it.fired){it.fired=1;it.hx=it.x;it.hy=G-30;hiss(4,.12,1800);whistle(1.5)}const q=it.t-it.fuse;if(q>4){boom(.5);burst(it.hx,it.hy,'multi',.7,R()*360,60);smoke(it.hx,it.hy,.6);it.dead=1;return}it.hx+=Math.sin(q*3.3)*130*dt;it.hy+=(-120+Math.sin(q*5)*70)*dt;if(it.hy<H*.18)it.hy=H*.18;for(let j=0;j<5;j++){const a=R()*PI2;sp(it.hx+Math.cos(a)*10,it.hy+Math.sin(a)*3,(R()-.5)*80,60+R()*80,.4,40+R()*20,100,70,1.3,200,.92)}glow(it.hx,it.hy,50,.05,'255,200,100')}
else if(k=='anar'||k=='rainbow'){const D=9,pr=(it.t-it.fuse)/D;if(pr>1){it.dead=1;return}if(!it.fired){it.fired=1;hiss(D,.16,3500)}
const I2=Math.pow(Math.sin(Math.PI*Math.min(pr,1)),.6)*.85+.15;glow(it.x,G-40,120+80*I2,.05,'255,170,60');
const c=Math.ceil(16*I2*dt*60/1.4);for(let i=0;i<c;i++){const hot=R()<.3;sp(it.x,G-42,(R()-.5)*190*I2,-(260+R()*380)*I2,.8+R()*.8,hot?50:(k=='rainbow'?(it.t*70+i*25)%360:28+R()*20),hot?30:95,hot?90:62,1.4+R(),520,.99,R()<.05)}
if(R()<.15)crack(.15)}}
function drawItem(it){const x=it.x,y=G,b=cx;b.save();
if(it.k=='sky'){b.fillStyle='#b3261e';b.fillRect(x-14,y-70,28,70);b.fillStyle='#f5d76e';b.fillRect(x-14,y-48,28,10);b.fillStyle='#fff';b.fillRect(x-14,y-35,28,3);it.tx=x+4;it.ty=y-82;b.strokeStyle='#ddd';b.beginPath();b.moveTo(x,y-70);b.lineTo(it.tx,it.ty);b.stroke()}
